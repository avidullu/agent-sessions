# Tag-triggered release: build, verify, publish to PyPI via Trusted Publishing.
#
# This workflow runs no gates (ci.yml is the gate set local_ci.sh mirrors); it
# only builds and publishes an already-green, tagged commit. Publishing uses
# PyPI Trusted Publishing (OIDC) — no long-lived token is stored anywhere.
# One-time setup on pypi.org: add a "pending publisher" for project
# `agent-session-hub`, owner `avidullu`, repository `agent-sessions`, workflow
# `release.yml`, environment `pypi`.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'ci-heavy' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify tag matches package version
        run: |
          python -m pip install packaging
          python - <<'PY'
          import os
          import pathlib
          import tomllib
          from packaging.version import Version

          with pathlib.Path("pyproject.toml").open("rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          parsed = Version(version)
          if parsed.is_devrelease or parsed.is_prerelease:
              raise SystemExit(
                  f"refusing to Trusted-Publish non-final version {version!r} "
                  f"(is_devrelease={parsed.is_devrelease}, is_prerelease={parsed.is_prerelease})"
              )
          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"release tag {tag!r} does not match package version {version!r}; expected {expected!r}")
          PY

      - name: Create isolated Python environment
        uses: ./.github/actions/ci-python-venv

      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build

      - name: Twine metadata check (L4)
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'ci-light' }}
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
