name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (py ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os == 'ubuntu-latest' && github.server_url != 'https://github.com' && 'ci-heavy' || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # The project standardizes CI on one interpreter to keep the routine
        # fast and predictable. The package retains its wider runtime floor;
        # compatibility below 3.13 is not a CI-backed claim.
        python-version: ["3.13"]
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Create isolated Python environment
        uses: ./.github/actions/ci-python-venv

      - name: Install
        # -c pins the gate toolchain so the verdict on a commit does not depend
        # on which day it was checked. See constraints-dev.txt.
        run: python -m pip install -e ".[dev]" -c constraints-dev.txt

      - name: Test with coverage
        # --cov-fail-under is stated here as well as in pyproject.toml so the
        # floor is visible in the gate itself. The two must stay numerically
        # equal; the CLI value wins if they ever disagree.
        run: python -m pytest --cov=agent_sessions --cov-report=term-missing --cov-fail-under=92

  test-windows:
    # These legs run on BOTH forges and are unconditional by design.
    #
    # They previously carried `if: github.server_url == 'https://github.com'`,
    # on the premise that every registered Forgejo runner was Linux. That
    # premise was already false (avis-msi-win-runner and avis-surface-win-runner
    # both advertise `windows-latest`), and because GitHub Actions is disabled
    # on the backup mirror the condition was never true on any forge either.
    # The result: native-Windows tests executed nowhere, while Forgejo's
    # skipped-to-success status mapping reported them green. See ci-gate below.
    name: test (py ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.13"]
    steps:
      # Do not use reusable actions in this job. One registered Windows runner
      # cannot clone action repositories because its runner/Git combination
      # invokes `git --config-env` incompatibly. The repository checkout is
      # intentionally explicit and the short-lived token is never persisted.
      - name: Check out without reusable actions
        shell: powershell
        env:
          CI_REPOSITORY_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:CI_REPOSITORY_TOKEN) { throw 'github.token is unavailable for the repository checkout.' }
          $remote = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
          $credential = "$env:GITHUB_ACTOR`:$env:CI_REPOSITORY_TOKEN"
          $basic = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($credential))
          git init .
          if ($LASTEXITCODE -ne 0) { throw 'git init failed.' }
          $remotes = @(git remote)
          if ($remotes -contains 'origin') { git remote set-url origin $remote } else { git remote add origin $remote }
          if ($LASTEXITCODE -ne 0) { throw 'Configuring the origin remote failed.' }
          git -c "http.extraHeader=Authorization: Basic $basic" fetch --no-tags --depth=1 origin $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Fetching commit $env:GITHUB_SHA failed." }
          Remove-Variable credential, basic
          git checkout --detach --force FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Checking out FETCH_HEAD failed.' }
          git clean -ffdx
          if ($LASTEXITCODE -ne 0) { throw 'Cleaning the CI workspace failed.' }

      - name: Select Python and create isolated environment
        shell: powershell
        run: ./scripts/ci-python-venv.ps1 -PythonVersion "${{ matrix.python-version }}"

      - name: Install
        shell: powershell
        run: '& $env:CI_PYTHON -m pip install -e ".[dev]" -c constraints-dev.txt'

      - name: Test with coverage
        shell: powershell
        run: '& $env:CI_PYTHON -m pytest --cov=agent_sessions --cov-report=term-missing --cov-fail-under=92'

  lint:
    name: lint (ruff + mypy)
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'ci-heavy' }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Create isolated Python environment
        uses: ./.github/actions/ci-python-venv

      - name: Install
        # -c pins the gate toolchain so the verdict on a commit does not depend
        # on which day it was checked. See constraints-dev.txt.
        run: python -m pip install -e ".[dev]" -c constraints-dev.txt

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy agent_sessions tools tests

  # Internal-link guard (tools/check_md_links.py): fails on a broken internal
  # markdown link (missing file or dead #anchor) in a LIVE doc. docs/archives/**
  # is excluded — frozen snapshots whose relative links are historical-by-design.
  # Borrowed from badminton-highlight-indexer (Khelsutra).
  link-check:
    name: Markdown link check (live docs)
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'ci-light' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check internal markdown links
        run: python -m tools.check_md_links

  # Privacy guard (tools/check_pii.py, L11): fails when a tracked file carries
  # a real user home path (native, WSL, or encoded project-key form), a tailnet
  # hostname, or a personal email. Placeholder usernames (example-user, test
  # fakes) are the explicit allowlist inside the tool.
  pii-check:
    name: PII scan (tracked files)
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'ci-light' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Scan tracked files for private paths and identifiers
        run: python -m tools.check_pii

  # The single honest required check. Branch protection should require THIS
  # context and no other.
  #
  # Forgejo maps a SKIPPED job to `success` in the commit-status API, so a job
  # that never ran still renders a green check on the PR. Reading the individual
  # contexts therefore cannot distinguish "passed" from "never executed".
  # scripts/ci-gate.sh asserts on `needs.<job>.result`, where `skipped` is a
  # distinct value from `success` and is rejected.
  #
  # `if: ${{ always() }}` is required: without it this job would itself be
  # skipped whenever a dependency failed, and would then report success — the
  # exact bug it exists to prevent.
  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs: [test, test-windows, lint, link-check, pii-check]
    # Never a conditional runner label here. A gate that cannot be scheduled on
    # some forge queues forever or resolves green, which is another false pass.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Assert every required job ran and succeeded
        run: bash scripts/ci-gate.sh "test=${{ needs.test.result }}" "test-windows=${{ needs.test-windows.result }}" "lint=${{ needs.lint.result }}" "link-check=${{ needs.link-check.result }}" "pii-check=${{ needs.pii-check.result }}"
