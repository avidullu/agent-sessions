name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test with coverage
        run: python -m pytest --cov=agent_sessions --cov-report=term-missing

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy agent_sessions tools
